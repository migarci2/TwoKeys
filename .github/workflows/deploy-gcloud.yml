name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - web/**
      - infra/deploy.sh
      - .github/workflows/deploy-gcloud.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: twokeys-cloud-run-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GOOGLE_ADS_CONFIGURATION_SNAPSHOT_HASH: ${{ vars.GOOGLE_ADS_CONFIGURATION_SNAPSHOT_HASH }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'twokeys' }}
      ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'twokeys' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT GOOGLE_ADS_CONFIGURATION_SNAPSHOT_HASH; do
            [[ -n "${!name}" ]] || { echo "Missing GitHub Actions variable: ${name}" >&2; exit 1; }
          done
          [[ "${GOOGLE_ADS_CONFIGURATION_SNAPSHOT_HASH}" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "GOOGLE_ADS_CONFIGURATION_SNAPSHOT_HASH must be a SHA-256 digest." >&2
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify application
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npm test
          npm run lint

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify deployment target
        shell: bash
        run: |
          set -euo pipefail
          owner="$(gcloud run services describe "${SERVICE_NAME}" \
            --region="${GCP_REGION}" --project="${GCP_PROJECT_ID}" \
            --format='value(metadata.labels.twokeys_owner)')"
          [[ "${owner}" == "deploy-script" ]] || {
            echo "Refusing to deploy over an unowned Cloud Run service: ${SERVICE_NAME}" >&2
            exit 1
          }

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          registry="${GCP_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/web:${GITHUB_SHA}"
          gcloud auth configure-docker "${registry}" --quiet
          docker build --tag "${image}" web
          docker push "${image}"
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"

      - name: Deploy owned service
        env:
          DEPLOY_ONLY: "true"
        run: ./infra/deploy.sh
